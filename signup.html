<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | DPS EDU</title><link rel="stylesheet" href="assets/auth.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f7fb}.auth-header{display:none}.signup-card{width:min(430px,calc(100% - 32px));background:#fff;padding:34px;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 18px 50px #20334d12}.signup-card h1{text-align:center;margin:0 0 24px}.signup-card .field{margin:16px 0}.signup-card input{width:100%;min-height:50px;font-size:16px}.signup-card .password-row{display:flex;gap:8px}.signup-card .password-row input{flex:1;min-width:0}.signup-card .btn{min-height:48px}</style></head><body><main class="signup-card"><h1>회원가입</h1><form id="form"><div class="field"><label for="username">아이디</label><input id="username" required minlength="3" maxlength="24" autocomplete="username" placeholder="영문·숫자 3~24자"></div><div class="field"><label for="name">이름</label><input id="name" required maxlength="40" autocomplete="name" placeholder="이름 입력"></div><div class="field"><label for="password">비밀번호</label><div class="password-row"><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="8자 이상"><button class="btn" id="toggle" type="button">표시</button></div></div><button class="btn primary full" type="submit">회원가입</button></form><p id="message" role="status" hidden></p><p style="text-align:center;margin-top:18px">이미 계정이 있나요? <a href="login.html">로그인</a></p></main><script src="assets/auth.js"></script><script>const $=id=>document.getElementById(id);$('toggle').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'표시':'숨기기'};$('form').onsubmit=async e=>{e.preventDefault();const m=$('message');try{await DpsAuth.signUp({username:$('username').value,name:$('name').value,password:$('password').value});$('password').value='';m.hidden=false;m.className='note';m.textContent='회원가입이 완료되었습니다. 로그인 화면으로 이동합니다.';setTimeout(()=>location.href='login.html',900)}catch(err){m.hidden=false;m.className='note warning';m.textContent=err.message}};DpsAuth.ready();</script></body></html>
