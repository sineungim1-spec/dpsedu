<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | DPS EDU</title><link rel="stylesheet" href="assets/auth.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f7fb}.login-card{width:min(430px,calc(100% - 32px));background:#fff;padding:36px;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 18px 50px #20334d12}.login-card h1{text-align:center;margin:0 0 8px}.login-card>p{text-align:center;color:#64748b;margin:0 0 26px}.login-card .field{margin:16px 0}.login-card input{width:100%;min-height:50px;font-size:16px}.login-card .password-row{display:flex;gap:8px}.login-card .password-row input{flex:1;min-width:0}.login-card .btn{min-height:48px}.login-card .links{display:flex;justify-content:center;margin-top:18px;gap:18px}.login-card .brand{text-align:center;font-weight:800;color:#1d4ed8;letter-spacing:.08em;margin-bottom:18px}</style></head><body><main class="login-card"><div class="brand">DPS EDU</div><h1>로그인</h1><p>이메일과 비밀번호를 입력해 주세요.</p><form id="form"><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required placeholder="이메일 주소"></div><div class="field"><label for="password">비밀번호</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호"><button class="btn" id="toggle" type="button">표시</button></div></div><button class="btn primary full" id="submit" type="submit">로그인</button></form><p id="message" role="status" style="margin:14px 0 0" hidden></p><div class="links"><a href="signup.html">회원가입</a><a href="index.html">홈으로</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script>const $=id=>document.getElementById(id);$('toggle').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'표시':'숨기기'};$('form').onsubmit=async e=>{e.preventDefault();const m=$('message'),b=$('submit');b.disabled=true;try{const u=await DpsAuth.signIn({email:$('email').value,password:$('password').value});m.hidden=true;const next=new URLSearchParams(location.search).get('next');location.href=next||(u.role==='admin'?'admin.html':'index.html')}catch(err){m.hidden=false;m.className='note warning';m.textContent=err.message;b.disabled=false}};DpsAuth.ready().catch(e=>{const m=$('message');m.hidden=false;m.className='note warning';m.textContent=e.message});</script></body></html>
