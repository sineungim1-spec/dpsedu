<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 | DPS EDU</title><link rel="stylesheet" href="assets/auth.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#1d4ed8;color:#fff}.section{display:none}.section.active{display:block}.table-wrap input{max-width:100%}</style></head><body><header class="auth-header"><nav class="site-nav"><a href="index.html">DPS EDU</a><a href="simulator.html">시뮬레이터</a><span class="nav-spacer"></span><span data-user-label></span><button data-logout type="button">로그아웃</button></nav><h1>관리자 대시보드</h1></header><main class="container"><div class="tabs"><button class="btn active" data-tab="dash">대시보드</button><button class="btn" data-tab="users">회원 관리</button><button class="btn" data-tab="records">데이터 관리</button><button class="btn" data-tab="contents">콘텐츠 관리</button><button class="btn" data-tab="settings">관리자 설정</button></div><section id="dash" class="section active"><div class="grid grid3"><div class="stat"><small>전체 회원</small><strong id="uc">0</strong></div><div class="stat"><small>전체 활동 기록</small><strong id="rc">0</strong></div><div class="stat"><small>등록 콘텐츠</small><strong id="cc">0</strong></div></div><article class="panel" style="margin-top:14px"><h2>최근 활동</h2><div id="recent">등록된 데이터가 없습니다.</div></article></section><section id="users" class="section panel"><h2>회원 관리</h2><div class="actions"><input id="uq" placeholder="아이디·이름 검색"><button class="btn" id="ue">회원 CSV</button><button class="btn danger" id="ud">선택 삭제</button></div><div class="table-wrap"><table><thead><tr><th>선택</th><th>아이디</th><th>이름</th><th>역할</th><th>가입일</th><th>수정</th></tr></thead><tbody id="ut"></tbody></table></div></section><section id="records" class="section panel"><h2>활동 데이터 관리</h2><div class="actions"><input id="rq" placeholder="회원·결과 검색"><button class="btn" id="re">데이터 CSV</button><button class="btn" id="rj">JSON 백업</button><button class="btn danger" id="rd">선택 삭제</button></div><div class="table-wrap"><table><thead><tr><th>선택</th><th>회원</th><th>일시</th><th>끼워맞춤</th><th>축 오차</th><th>결과</th></tr></thead><tbody id="rt"></tbody></table></div></section><section id="contents" class="section panel"><h2>실습 콘텐츠 관리</h2><form id="cf"><div class="field"><label>콘텐츠 이름</label><input id="ct" required></div><div class="field"><label>교과·분야</label><input id="cs" value="기계요소설계"></div><div class="field"><label>학습 목표</label><input id="co"></div><div class="field"><label>설명</label><input id="cd"></div><div class="field"><label>HTML 경로 또는 URL</label><input id="cu" value="simulator.html"></div><button class="btn primary">콘텐츠 등록</button></form><div class="table-wrap"><table><thead><tr><th>이름</th><th>분야</th><th>공개</th><th>관리</th></tr></thead><tbody id="ctb"></tbody></table></div></section><section id="settings" class="section panel"><h2>관리자 설정</h2><p class="muted">비밀번호는 Supabase 계정 보안 설정에서 변경하세요. 아래는 서비스 표시 설정입니다.</p><form id="sf"><div class="field"><label>프로그램 이름</label><input id="pn"></div><div class="field"><label>기본 화면 경로</label><input id="hp"></div><button class="btn">설정 저장</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script>(async()=>{try{const me=await DpsAuth.requireAdmin();if(!me)return;const $=id=>document.getElementById(id);let users=[],records=[],contents=[];document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});const csv=(name,rows)=>{const s='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)};const json=(name,data)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await DpsAuth.getDashboardData();users=d.users;records=d.records;contents=d.contents;$('uc').textContent=users.length;$('rc').textContent=records.length;$('cc').textContent=contents.length;$('recent').textContent=records.length?records.slice(0,5).map(r=>(r.displayName||r.username||'회원')+' · '+new Date(r.createdAt).toLocaleString('ko-KR')).join(' / '):'등록된 데이터가 없습니다.';drawUsers();drawRecords();drawContents()}function drawUsers(){const q=$('uq').value.toLowerCase();$('ut').innerHTML=users.filter(u=>(u.username+' '+u.name+' '+u.email).toLowerCase().includes(q)).map(u=>'<tr><td><input type="checkbox" class="ucb" value="'+u.id+'"></td><td>'+esc(u.email||u.username)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.role)+'</td><td>'+new Date(u.createdAt).toLocaleDateString('ko-KR')+'</td><td><button class="btn" data-edit-user="'+u.id+'">이름 수정</button></td></tr>').join('')||'<tr><td colspan="6">등록된 데이터가 없습니다.</td></tr>';document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=async()=>{const u=users.find(x=>x.id===b.dataset.editUser),v=prompt('이름 수정',u.name);if(v?.trim()){try{await DpsAuth.updateUser(u.id,{name:v.trim()});await load()}catch(e){alert(e.message)}}})}function drawRecords(){const q=$('rq').value.toLowerCase();$('rt').innerHTML=records.filter(r=>(r.displayName+' '+r.username+' '+r.result).toLowerCase().includes(q)).map(r=>'<tr><td><input type="checkbox" class="rcb" value="'+r.id+'"></td><td>'+esc(r.displayName||r.username)+'</td><td>'+new Date(r.createdAt).toLocaleString('ko-KR')+'</td><td>'+esc(r.fit)+'</td><td>'+esc(r.shaftError)+'</td><td>'+esc(r.result)+'</td></tr>').join('')||'<tr><td colspan="6">등록된 데이터가 없습니다.</td></tr>'}function drawContents(){$('ctb').innerHTML=contents.map(c=>'<tr><td>'+esc(c.title)+'</td><td>'+esc(c.subject)+'</td><td><input type="checkbox" data-visible="'+c.id+'" '+(c.visible?'checked':'')+'></td><td><button class="btn" data-edit-content="'+c.id+'">수정</button> <button class="btn danger" data-del-content="'+c.id+'">삭제</button></td></tr>').join('')||'<tr><td colspan="4">등록된 콘텐츠가 없습니다.</td></tr>';document.querySelectorAll('[data-visible]').forEach(x=>x.onchange=async()=>{const c=contents.find(c=>c.id===x.dataset.visible);try{await DpsAuth.saveContent({...c,visible:x.checked});await load()}catch(e){alert(e.message);x.checked=!x.checked}});document.querySelectorAll('[data-edit-content]').forEach(b=>b.onclick=async()=>{const c=contents.find(c=>c.id===b.dataset.editContent),v=prompt('콘텐츠 이름 수정',c.title);if(v?.trim()){try{await DpsAuth.saveContent({...c,title:v.trim()});await load()}catch(e){alert(e.message)}}});document.querySelectorAll('[data-del-content]').forEach(b=>b.onclick=async()=>{if(confirm('삭제하시겠습니까?')){try{await DpsAuth.deleteContents([b.dataset.delContent]);await load()}catch(e){alert(e.message)}}})}$('uq').oninput=drawUsers;$('rq').oninput=drawRecords;$('ud').onclick=async()=>{const ids=[...document.querySelectorAll('.ucb:checked')].map(x=>x.value);if(ids.length&&confirm('선택한 회원을 삭제할까요?')){try{await DpsAuth.deleteUsers(ids);await load()}catch(e){alert(e.message)}}};$('ue').onclick=()=>csv('회원목록.csv',[['아이디','이름','역할','가입일'],...users.map(u=>[u.username,u.name,u.role,u.createdAt])]);$('rd').onclick=async()=>{const ids=[...document.querySelectorAll('.rcb:checked')].map(x=>x.value);if(ids.length&&confirm('선택한 실습 기록을 삭제할까요?')){try{await DpsAuth.deleteRecords(ids);await load()}catch(e){alert(e.message)}}};$('re').onclick=()=>csv('활동기록.csv',[['회원','아이디','일시','끼워맞춤','축 오차','결과'],...records.map(r=>[r.displayName,r.username,r.createdAt,r.fit,r.shaftError,r.result])]);$('rj').onclick=()=>json('DPS_EDU_데이터백업.json',{users,records,contents});$('cf').onsubmit=async e=>{e.preventDefault();try{await DpsAuth.saveContent({title:$('ct').value.trim(),subject:$('cs').value,objective:$('co').value,description:$('cd').value,url:$('cu').value,visible:true});e.target.reset();await load()}catch(x){alert(x.message)}};const s=await DpsAuth.getSettings();$('pn').value=s.programName??'DPS EDU';$('hp').value=s.homePage??'index.html';$('sf').onsubmit=async e=>{e.preventDefault();try{await DpsAuth.updateSettings({programName:$('pn').value,homePage:$('hp').value});alert('설정을 저장했습니다.')}catch(x){alert(x.message)}};await load()}catch(e){alert(e.message);console.error(e)}})();</script></body></html>
