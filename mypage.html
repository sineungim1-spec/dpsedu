<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | DPS EDU</title><link rel="stylesheet" href="assets/auth.css"></head><body><header class="auth-header"><nav class="site-nav"><a href="index.html">DPS EDU</a><a href="simulator.html">시뮬레이터</a><a href="mypage.html">마이페이지</a><span class="nav-spacer"></span><span data-user-label></span><button data-logout type="button">로그아웃</button></nav><h1>마이페이지</h1></header><main class="container"><section class="grid"><article class="panel"><h2>내 정보</h2><p class="muted" id="email"></p><form id="profile"><div class="field"><label for="name">이름</label><input id="name" required maxlength="60"></div><button class="btn primary">이름 변경</button></form></article><article class="panel"><h2>비밀번호 변경</h2><form id="pw"><div class="field"><label for="old">현재 비밀번호</label><input id="old" type="password" required autocomplete="current-password"></div><div class="field"><label for="next">새 비밀번호</label><input id="next" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary">비밀번호 변경</button></form></article></section><section class="panel" style="margin-top:14px"><h2>나의 실습 기록</h2><p id="count">불러오는 중…</p><div class="table-wrap"><table><thead><tr><th>날짜</th><th>끼워맞춤</th><th>베어링 오차</th><th>축 오차</th><th>결과</th></tr></thead><tbody id="records"></tbody></table></div><button class="btn" id="csv">CSV 다운로드</button> <a class="btn primary" href="simulator.html">실습 시작</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script>(async()=>{try{const u=await DpsAuth.requireLogin();if(!u)return;const $=id=>document.getElementById(id);$('name').value=u.name;$('email').textContent=u.email;$('profile').onsubmit=async e=>{e.preventDefault();try{await DpsAuth.updateProfile({name:$('name').value});alert('이름을 변경했습니다.');location.reload()}catch(x){alert(x.message)}};$('pw').onsubmit=async e=>{e.preventDefault();try{await DpsAuth.changePassword({currentPassword:$('old').value,newPassword:$('next').value});alert('비밀번호를 변경했습니다.');e.target.reset()}catch(x){alert(x.message)}};const rows=await DpsAuth.getRecords(),tb=$('records');$('count').textContent=rows.length+'건';tb.innerHTML=rows.map(r=>'<tr><td>'+new Date(r.createdAt).toLocaleString('ko-KR')+'</td><td>'+String(r.fit||'')+'</td><td>'+String(r.bearingError??'')+'</td><td>'+String(r.shaftError??'')+'</td><td>'+String(r.result||'')+'</td></tr>').join('')||'<tr><td colspan="5">등록된 데이터가 없습니다.</td></tr>';$('csv').onclick=()=>{const csv='\uFEFF'+[['날짜','끼워맞춤','베어링 오차','축 오차','결과'],...rows.map(r=>[r.createdAt,r.fit,r.bearingError,r.shaftError,r.result])].map(a=>a.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='나의_실습기록.csv';a.click();URL.revokeObjectURL(a.href)}}catch(e){alert(e.message)}})();</script></body></html>
